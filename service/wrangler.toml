name = "tap-to-fix"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Placeholder bindings; deploy config is a later plan.
[[d1_databases]]
binding = "DB"
database_name = "tap-to-fix"
database_id = "local-placeholder"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "SHOTS"
bucket_name = "tap-to-fix-shots"

# OWNER_TOKEN and LINK_KEY: local dev reads them from the git-ignored .dev.vars;
# tests set them in test/env.ts; prod uses `wrangler secret put` (scripts/deploy.mjs).
# LINK_KEY is optional locally: without it, reviewer links can't be copied again.

# Built client (t.js, overlay.js) is served from here; run `npm run build:client` first.
[assets]
directory = "./public"
