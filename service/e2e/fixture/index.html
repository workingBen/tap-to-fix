<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixture home</title>
  <link rel="stylesheet" href="/hostile.css">
  <script src="http://localhost:8788/t.js" data-site="fixture" defer></script>
</head>
<body>
  <!-- The review bar overlays the top 52 px, as a site header would sit under it. -->
  <header style="height: 90px">Fixture site header</header>
  <h1>Welcome to the fixture</h1>
  <p id="intro">This page stands in for a real site while the overlay is tested.</p>
  <!-- Served from a second origin without CORS headers, so a screenshot cannot read it. -->
  <img id="photo" src="http://localhost:4174/photo.jpg" width="240" height="160" alt="A photo from another site">
  <p><a id="other-link" href="/other.html">Read the other page</a></p>
  <form action="/other.html"><button id="go" type="submit">Send the form</button></form>
  <button id="counter" onclick="this.textContent=String(+this.textContent+1)">0</button>
  <div role="tablist">
    <button type="button" role="tab" id="tab-a">Tab A</button>
    <button type="button" role="tab" id="tab-b">Tab B</button>
  </div>
  <div id="panel-a">Panel A</div>
  <div id="panel-b" hidden>Panel B</div>
  <details id="more"><summary>More</summary><p>Hidden text</p></details>
  <ul>
    <li>First thing to review</li>
    <li>Second thing to review</li>
  </ul>
  <p id="far" style="margin: 900px 0">Far down a long page.</p>
  <!-- A lazy image far below the fold never loads; it must not hold up a screenshot. -->
  <div style="height:3000px"></div>
  <img loading="lazy" src="http://localhost:4174/photo.jpg?lazy" width="240" height="160" alt="Below the fold">
  <script>
    for (const tab of document.querySelectorAll("[role=tab]")) {
      tab.addEventListener("click", () => {
        document.getElementById("panel-a").hidden = tab.id !== "tab-a";
        document.getElementById("panel-b").hidden = tab.id !== "tab-b";
      });
    }
  </script>
  <script>
    // A typical site keyboard shortcut: ignores keys typed into fields, reacts to "/" and "j".
    document.addEventListener("keydown", (e) => {
      const t = e.target;
      if (t instanceof HTMLInputElement || t instanceof HTMLTextAreaElement || (t && t.isContentEditable)) return;
      if (e.key === "/" || e.key === "j" || e.key === " ") document.body.dataset.shortcut = e.key;
    });
    document.addEventListener("input", () => { document.body.dataset.pageInput = "1"; });
  </script>
</body>
</html>
