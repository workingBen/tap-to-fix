<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixture sticky</title>
  <script src="http://localhost:8788/t.js" data-site="fixture" defer></script>
  <style>
    body { margin: 0; font: 18px/1.5 sans-serif; }
    /* A white header that stays at the top, as greensprings.life's does. */
    #site-header { position: sticky; top: 0; z-index: 10; height: 96px; box-sizing: border-box; background: #fff; display: flex; align-items: flex-end; padding: 0 16px 14px; border-bottom: 1px solid #ddd; }
    #site-header a { color: #111; font-weight: 700; letter-spacing: 0.1em; }
    main { padding: 16px; }
  </style>
</head>
<body>
  <header id="site-header"><a id="logo" href="/index.html">GREENSPRINGS LONGEVITY</a></header>
  <main>
    <h1 id="title">Book a session</h1>
    <p id="first">The first paragraph sits just below the header.</p>
    <div style="height: 2000px"></div>
    <p id="last">The end of the page.</p>
  </main>
</body>
</html>
